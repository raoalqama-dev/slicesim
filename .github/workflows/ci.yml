name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # The CPU build of PyTorch is a fraction of the size of the default one.
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,rl,plots,dashboard]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Without the extras their tests skip; coverage is measured in the extras
      # job, which runs everything.
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  extras:
    name: Tests with every extra, and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,rl,plots,dashboard]"
      - run: pytest --cov --cov-report=term-missing

  minimum-versions:
    name: Tests with the oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          activate-environment: true
      - run: >-
          uv pip install --resolution lowest-direct -e ".[rl]" "pytest>=8"
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
          --index-strategy unsafe-best-match
      - run: python -m pytest -p no:cacheprovider
