# Every traffic model sharing one 20 MHz urban macro cell. Run it with:
#   slicesim run scenarios/basic.yaml
name: basic
description: four traffic types sharing a 20 MHz cell
seed: 1
duration_s: 10

carrier:
  bandwidth_mhz: 20   # 51 PRBs at 30 kHz (TS 38.101-1 Table 5.3.2-1)
  scs_khz: 30         # numerology 1, 0.5 ms slots

cell:                 # TR 38.901 urban macro, UEs dropped uniformly
  radius_m: 300
  frequency_ghz: 3.5
  tx_power_dbm: 46
  noise_figure_db: 7
  interference_margin_db: 3

channel:
  shadowing: true     # log-normal, 4 dB LOS and 6 dB NLOS
  fading: rayleigh
  coherence_ms: 40    # a pedestrian at 3.5 GHz: Doppler 9.7 Hz, coherence 0.423 / f_D

link:
  model: adaptive     # CQI per TS 38.214 Table 5.2.2.1-2, 10% BLER target
  cqi_delay_slots: 2
  harq_rtt_slots: 8
  max_transmissions: 4

ues:
  - name: video
    count: 8
    traffic:
      model: on_off
      mean_on_ms: 2000
      mean_off_ms: 1000
      frame_rate_fps: 30
      frame_bytes: 12500  # 3 Mbit/s while on, 2 Mbit/s on average

  - name: control
    count: 10
    traffic:
      model: periodic
      period_ms: 10
      packet_bytes: 100

  - name: sensors
    count: 50
    traffic:
      model: poisson
      rate_pps: 2
      packet_bytes: 200

  - name: bulk
    count: 2
    traffic:
      model: full_buffer
