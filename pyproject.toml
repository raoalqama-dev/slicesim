[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "slicesim"
dynamic = ["version"]
description = "Discrete-time 5G RAN slicing simulator comparing classic schedulers with a reinforcement-learning slice controller."
readme = "README.md"
authors = [{ name = "Alqama Rao" }]
requires-python = ">=3.11"
keywords = ["5g", "network-slicing", "reinforcement-learning", "simulation", "ppo", "telecom"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.0",
    "torch>=2.5.1",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
slicesim = "slicesim.cli:main"

[project.urls]
Repository = "https://github.com/raoalqama-dev/slicesim"
Changelog = "https://github.com/raoalqama-dev/slicesim/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/slicesim/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scenarios", "models", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "NPY",  # numpy
    "PT",   # pytest style
    "RUF",  # ruff-specific
    "SIM",  # simplifications
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["slicesim"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
